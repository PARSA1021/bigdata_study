<!doctype html>
<html lang="ko" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="빅분기 필기" />
    <meta name="theme-color" content="#007AFF" />

    <title>빅데이터분석기사 요약노트</title>

    <!-- PWA Manifest & Icons -->
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />

    <script>
      // 빠른 테마 적용 (깜빡임 방지)
      const savedTheme = localStorage.getItem("theme") || "light";
      document.documentElement.setAttribute("data-theme", savedTheme);
    </script>
  </head>
  <body>
    <!-- 모바일 메뉴 오버레이 -->
    <div id="overlay" class="overlay"></div>

    <!-- 상단 네비게이션 바 -->
    <header class="topbar blur-glass">
      <button id="menuBtn" class="icon-btn" aria-label="메뉴 열기">
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        >
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <h1 class="topbar-title">빅데이터분석기사 <span class="badge-tag">필기 마스터</span></h1>
      <div class="topbar-actions">
        <button id="splitViewBtn" class="icon-btn split-btn" title="화면 분할 뷰 (노트+문제)" aria-label="화면 분할 뷰">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="12" y1="3" x2="12" y2="21"></line>
          </svg>
        </button>
        <button id="statsToggleBtn" class="icon-btn stats-btn" title="학습 성적 및 약점 분석" aria-label="학습 성적 및 약점 분석">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="18" y1="20" x2="18" y2="10"></line>
            <line x1="12" y1="20" x2="12" y2="4"></line>
            <line x1="6" y1="20" x2="6" y2="14"></line>
          </svg>
        </button>
        <button id="quizToggleBtn" class="quiz-btn">문제 풀기</button>
        <button
          id="themeToggleBtn"
          class="icon-btn theme-btn"
          title="다크모드 전환"
        >
          <svg
            class="sun-icon"
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          >
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg
            class="moon-icon"
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          >
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </header>

    <div class="layout" id="mainLayout">
      <!-- 사이드바 (과목 목차) -->
      <aside id="sidebar" class="sidebar blur-glass">
        <div class="sidebar-header">
          <h2>과목 목차</h2>
          <button
            id="closeSidebarBtn"
            class="icon-btn close-btn"
            aria-label="사이드바 닫기"
          >
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            >
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <div class="search-box">
          <svg
            class="search-icon"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          >
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input
            type="text"
            id="searchInput"
            placeholder="키워드 검색... (Ctrl/⌘+K)"
          />
          <button id="clearSearchBtn" class="search-clear-btn hidden" aria-label="검색어 지우기">✕</button>
        </div>
        <div id="searchStatus" class="search-status hidden"></div>
        <div class="sidebar-actions">
          <button id="expandAllBtn" class="btn-small">전체 펼치기</button>
          <button id="collapseAllBtn" class="btn-small">전체 접기</button>
        </div>
        <nav id="nav-container" class="nav-scroll"></nav>
      </aside>

      <!-- 메인 컨텐츠 영역 -->
      <main class="main-content" id="mainContent">
        <div class="content-wrapper">
          <div id="content">
            <div class="loading-spinner">
              <svg class="spinner" viewBox="0 0 50 50">
                <circle
                  class="path"
                  cx="25"
                  cy="25"
                  r="20"
                  fill="none"
                  stroke-width="5"
                ></circle>
              </svg>
              <p>데이터를 불러오는 중입니다...</p>
            </div>
          </div>
          <!-- 퀴즈 컨텐츠 영역 -->
          <div id="quiz-content" class="hidden">
            <!-- 모드 전환 탭 (연습 모드 vs 실전 모의고사 모드) -->
            <div class="mode-tabs">
              <button id="tabPractice" class="mode-tab active">
                <span class="tab-icon">📖</span> 연습 모드 (문제 풀기)
              </button>
              <button id="tabMockExam" class="mode-tab">
                <span class="tab-icon">⏱️</span> 실전 CBT 모의고사 (80제)
              </button>
            </div>

            <!-- 연습 모드 헤더 -->
            <div id="practice-header" class="hero-section">
              <h2 class="hero-title">실전 모의고사 연습</h2>
              <p class="hero-subtitle">
                개념별 기출 유형 문제 풀어보기 · 즉시 정답 및 맞춤 요약노트 해설 연동
              </p>
            </div>

            <!-- 실전 모의고사 타이머 & OMR 토글 헤더 -->
            <div id="mock-header" class="hero-section hidden mock-banner">
              <div class="mock-info-bar">
                <div class="timer-box">
                  <span class="timer-label">남은 시간:</span>
                  <span id="examTimer" class="timer-value">120:00</span>
                </div>
                <div class="mock-actions">
                  <button id="openOmrBtn" class="btn-small omr-toggle-btn">📋 OMR 답안지 (<span id="omrSolvedCount">0</span>/80)</button>
                  <button id="submitExamBtn" class="btn-small submit-exam-btn">🏁 최종 제출하기</button>
                </div>
              </div>
              <div class="mock-presets" style="margin-top: 14px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;">
                <button id="mockPreset10th" class="btn-small active" style="background-color:var(--primary-color); color:#fff; border-color:var(--primary-color);">🏆 10회 기출 실전 모의고사 (80제)</button>
                <button id="mockPresetRandom" class="btn-small">🔀 랜덤과목 조합 모의고사 (80제)</button>
              </div>
            </div>

            <div id="quiz-toolbar" class="quiz-toolbar"></div>
            <div id="quiz-score" class="quiz-score"></div>
            <div id="quiz-container"></div>
          </div>
        </div>
      </main>
    </div>

    <!-- OMR 답안지 오버레이 (모바일 터치 닫기) -->
    <div id="omrOverlay" class="omr-overlay hidden"></div>

    <!-- OMR 답안지 드로어/패널 -->
    <div id="omrDrawer" class="omr-drawer blur-glass hidden">
      <div class="omr-header">
        <h3>📋 CBT OMR 답안지</h3>
        <button id="closeOmrBtn" class="icon-btn close-btn">✕</button>
      </div>
      <div class="omr-summary">
        <div>풀이: <strong id="omrProgress">0 / 80</strong></div>
        <div>검토 필요: <strong id="omrFlagCount">0</strong></div>
      </div>
      <div id="omrGrid" class="omr-grid"></div>
      <div class="omr-footer">
        <button id="omrSubmitBtn" class="quiz-btn w-full">최종 제출 및 채점하기</button>
      </div>
    </div>

    <!-- 학습 성과 및 약점 분석 모달 -->
    <div id="statsModal" class="modal-overlay hidden">
      <div class="modal-card blur-glass">
        <div class="modal-header">
          <h2>📊 학습 성적 & 약점 분석</h2>
          <button id="closeStatsBtn" class="icon-btn">✕</button>
        </div>
        <div class="modal-body">
          <div class="stats-summary-cards">
            <div class="stat-box">
              <div class="stat-value" id="statTotalSolved">0</div>
              <div class="stat-label">누적 풀이 문항</div>
            </div>
            <div class="stat-box">
              <div class="stat-value" id="statOverallAccuracy">0%</div>
              <div class="stat-label">전체 평균 정답률</div>
            </div>
            <div class="stat-box">
              <div class="stat-value" id="statBookmarks">0</div>
              <div class="stat-label">즐겨찾기 문항</div>
            </div>
          </div>

          <h3 class="stats-section-title">과목별 정답률 및 보충 필요도</h3>
          <div id="subjectStatsContainer" class="subject-stats-list"></div>

          <div id="weaknessAlert" class="weakness-alert hidden"></div>
          <div id="weakConceptContainer" class="weak-concept-container hidden"></div>
        </div>
        <div class="modal-footer">
          <button id="resetStatsBtn" class="btn-small text-danger">기록 초기화</button>
          <button id="closeStatsModalBtn" class="quiz-btn">확인</button>
        </div>
      </div>
    </div>

    <!-- 개념 요약 팝업 미리보기 모달 -->
    <div id="conceptModal" class="modal-overlay hidden">
      <div class="modal-card blur-glass concept-preview-modal">
        <div class="modal-header">
          <div class="modal-title-group">
            <span class="badge-tag">핵심 개념 요약</span>
            <h2 id="conceptModalTitle">개념 제목</h2>
          </div>
          <button id="closeConceptBtn" class="icon-btn">✕</button>
        </div>
        
        <!-- 개념 미리보기 vs 관련 기출문제 탭 -->
        <div class="concept-modal-tabs">
          <button id="tabConceptNote" class="concept-tab active">📖 핵심 요약노트</button>
          <button id="tabConceptQuiz" class="concept-tab">📝 관련 기출문제 (<span id="conceptRelatedCount">0</span>)</button>
        </div>

        <div class="modal-body">
          <div id="conceptModalBodyNote" class="concept-modal-pane">
            <!-- 개념 내용 및 블록 렌더링 -->
          </div>
          <div id="conceptModalBodyQuiz" class="concept-modal-pane hidden">
            <!-- 관련 기출문제 목록 렌더링 -->
          </div>
        </div>
        <div class="modal-footer">
          <button id="practiceConceptBtn" class="btn-small btn-primary-accent">🎯 이 개념 문제만 풀어보기</button>
          <button id="jumpToFullNoteBtn" class="btn-small">전체 요약노트 위치로 이동 ↗</button>
          <button id="closeConceptModalBtn" class="quiz-btn">닫기</button>
        </div>
      </div>
    </div>

    <!-- 모바일 하단 네비게이션 바 -->
    <nav class="bottom-nav blur-glass">
      <button class="bottom-nav-item active" data-nav="notes">
        <span class="nav-icon">📚</span>
        <span class="nav-label">요약노트</span>
      </button>
      <button class="bottom-nav-item" data-nav="practice">
        <span class="nav-icon">📝</span>
        <span class="nav-label">연습문제</span>
      </button>
      <button class="bottom-nav-item" data-nav="mock">
        <span class="nav-icon">⏱️</span>
        <span class="nav-label">실전CBT</span>
      </button>
      <button class="bottom-nav-item" data-nav="stats">
        <span class="nav-icon">📊</span>
        <span class="nav-label">성적분석</span>
      </button>
    </nav>

    <!-- 맨 위로 가기 버튼 -->
    <button id="toTop" class="to-top-btn blur-glass" aria-label="맨 위로 가기">
      <svg
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      >
        <line x1="12" y1="19" x2="12" y2="5"></line>
        <polyline points="5 12 12 5 19 12"></polyline>
      </svg>
    </button>

    <script src="app.js"></script>
  </body>
</html>
